<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>لوحة الأدمن - ڤيولا</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff5f8; padding: 1rem; direction: rtl; font-family: 'Tajawal', sans-serif; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 30px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(233,30,99,0.05); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #f8bbd9; }
        h1 { color: #e91e63; font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
        .logout-btn { background: linear-gradient(135deg, #e91e63, #f06292); color: white; border: none; padding: 8px 20px; border-radius: 40px; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .logout-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(233,30,99,0.3); }
        .section { background: white; border: 1px solid #f8bbd9; border-radius: 25px; margin-bottom: 1.5rem; overflow: hidden; }
        .section-header { background: #fff0f5; padding: 1rem 1.5rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #4a1a3a; transition: 0.2s; }
        .section-header:hover { background: #fce4ec; }
        .section-content { padding: 1.5rem; display: none; border-top: 1px solid #f8bbd9; }
        .section-content.open { display: block; }
        .btn { border: none; padding: 8px 18px; border-radius: 40px; font-weight: bold; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: 'Tajawal', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #e91e63, #f06292); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(233,30,99,0.3); }
        .btn-secondary { background: #fce4ec; color: #4a1a3a; border: 1px solid #f8bbd9; }
        .btn-secondary:hover { background: #f8bbd9; }
        .btn-danger { background: linear-gradient(135deg, #c2185b, #e91e63); color: white; }
        .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(233,30,99,0.3); }
        .btn-sm { padding: 5px 12px; font-size: 0.7rem; }
        .btn-block { width: 100%; justify-content: center; }
        .category-card { background: #fffafc; border-radius: 20px; padding: 1rem; margin-bottom: 1.5rem; border: 1px solid #f8bbd9; transition: 0.2s; }
        .category-card:hover { border-color: #e91e63; box-shadow: 0 2px 10px rgba(233,30,99,0.1); }
        .category-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px dashed #f8bbd9; }
        .subcategory-card { background: #fff5f8; border-radius: 16px; padding: 0.8rem; margin-bottom: 1rem; margin-right: 1rem; border: 1px solid #fce4ec; }
        .subcategory-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .products-list { margin-top: 0.8rem; padding-right: 1rem; border-right: 2px solid #f8bbd9; }
        .product-item { background: white; border-radius: 12px; padding: 0.6rem; margin-bottom: 0.5rem; border: 1px solid #f8bbd9; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; font-weight: 600; color: #4a1a3a; }
        input, textarea, select { width: 100%; padding: 10px 15px; border: 1px solid #f8bbd9; border-radius: 30px; font-family: inherit; font-size: 0.9rem; transition: 0.2s; background: white; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #e91e63; box-shadow: 0 0 0 2px rgba(233,30,99,0.2); }
        .file-upload-btn { background: #fce4ec; padding: 10px 20px; border-radius: 40px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-size: 0.85rem; transition: 0.2s; border: 1px solid #f8bbd9; }
        .file-upload-btn:hover { background: #f8bbd9; border-color: #e91e63; }
        .badge { font-size: 0.7rem; padding: 3px 12px; border-radius: 30px; display: inline-block; }
        .badge-active { background: #a8e6cf; color: #1b4332; }
        .badge-inactive { background: #f8bbd9; color: #4a1a3a; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .flex-start { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .mt-2 { margin-top: 0.8rem; }
        .mt-1 { margin-top: 0.5rem; }
        .subcat-icon { width: 32px; height: 32px; background: #fce4ec; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #a8e6cf; color: #1b4332; padding: 10px 25px; border-radius: 50px; font-size: 0.85rem; z-index: 10000; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: bold; }
        .toast.error { background: #e91e63; color: white; }
        .size-color-group { background: #fff0f5; padding: 12px; border-radius: 20px; margin: 10px 0; }
        .size-tag, .color-tag { display: inline-flex; align-items: center; gap: 5px; background: white; padding: 5px 12px; border-radius: 30px; margin: 4px; border: 1px solid #f8bbd9; }
        .remove-tag { background: none; border: none; color: #e91e63; cursor: pointer; margin-right: 5px; }
        @media (max-width: 768px) { .container { padding: 1rem; } .btn { padding: 6px 12px; font-size: 0.7rem; } .subcategory-card { margin-right: 0; } }
    </style>
</head>
<body>
<div class="container">
    <div class="admin-header">
        <h1><i class="fas fa-crown"></i> لوحة أدمن - ڤيولا</h1>
        <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>

    <!-- قسم الإعلانات -->
    <div id="adsSection" class="section">
        <div class="section-header" onclick="toggleSection('adsContent')">
            <span><i class="fas fa-ad"></i> إدارة الإعلانات</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div id="adsContent" class="section-content">
            <div id="adsList"></div>
            <div class="form-group" style="margin-top: 1rem; background:#fff0f5; padding:1rem; border-radius:20px;">
                <h4>➕ إضافة إعلان جديد</h4>
                <div class="file-upload-btn" onclick="document.getElementById('newAdImageFile').click()"><i class="fas fa-cloud-upload-alt"></i> اختر صورة</div>
                <input type="file" id="newAdImageFile" accept="image/*" style="display:none">
                <div id="newAdFileName" style="font-size:0.7rem;">📁 لم يتم اختيار ملف</div>
                <input type="text" id="newAdText" placeholder="نص الإعلان">
                <button id="addAdBtn" class="btn btn-primary btn-block mt-2"><i class="fas fa-plus"></i> إضافة إعلان</button>
            </div>
        </div>
    </div>

    <!-- قسم إدارة الأقسام والفئات والمنتجات -->
    <div class="section">
        <div class="section-header" onclick="toggleSection('categoriesContent')">
            <span><i class="fas fa-layer-group"></i> إدارة الأقسام والفئات والمنتجات</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div id="categoriesContent" class="section-content">
            <!-- إضافة قسم رئيسي جديد -->
            <div class="form-group" style="margin-bottom: 1.5rem; background:#fff0f5; padding:1rem; border-radius:20px;">
                <h4>➕ إضافة قسم رئيسي جديد</h4>
                <input type="text" id="newCatName" placeholder="اسم القسم (مثال: أزياء، جمال، إكسسوارات)">
                <div class="file-upload-btn mt-2" onclick="document.getElementById('newCatImageFile').click()"><i class="fas fa-cloud-upload-alt"></i> اختر صورة القسم (إجباري)</div>
                <input type="file" id="newCatImageFile" accept="image/*" style="display:none">
                <div id="newCatFileName" style="font-size:0.7rem;">📁 لم يتم اختيار ملف</div>
                <div class="form-group mt-2"><label>رقم الترتيب</label><input type="number" id="newCatOrder" value="1" min="1"></div>
                <button id="addCategoryBtn" class="btn btn-primary btn-block mt-2"><i class="fas fa-plus"></i> إضافة قسم رئيسي</button>
            </div>
            
            <!-- عرض جميع الأقسام مع فئاتها ومنتجاتها -->
            <div id="categoriesList"></div>
        </div>
    </div>

    <!-- قسم جميع المنتجات -->
    <div class="section">
        <div class="section-header" onclick="toggleSection('allProductsContent')">
            <span><i class="fas fa-boxes"></i> جميع المنتجات</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div id="allProductsContent" class="section-content">
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchAllProducts" placeholder="ابحث بالاسم أو الرمز..."></div>
            <div id="productsStats" class="badge" style="background:#fce4ec; margin-bottom:1rem;"></div>
            <div id="productsList"></div>
        </div>
    </div>
    
    <div class="footer-credit" style="text-align:center; margin-top:2rem; font-size:0.7rem; color:#b08a9e;">💜 تم التصميم بواسطة <strong>Ahmad Kllawe</strong> © 2026</div>
</div>
<div id="adminToast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyD9BbiQfVKWazBtuXE-g0HRkkq87qNY080",
        authDomain: "enath11.firebaseapp.com",
        databaseURL: "https://enath11-default-rtdb.firebaseio.com",
        projectId: "enath11",
        storageBucket: "enath11.firebasestorage.app",
        messagingSenderId: "1092002726764",
        appId: "1:1092002726764:web:20626338f00627d82ae949"
    };
    
    const CLOUD_NAME = "dfrvcl2m5";
    const UPLOAD_PRESET = "violla";
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    
    // Global Variables
    let currentUserRole = 'admin';
    let ads = [], categories = [], products = [];
    let lastSearchText = "";
    let tempProductImageFile = {}, tempEditCatFile = null, tempEditSubcatFile = null, tempEditAdFile = null, tempEditProductFile = {};
    
    // Helper Functions
    function showToast(msg, isError = false) {
        const t = document.getElementById('adminToast');
        t.innerText = msg;
        t.className = 'toast' + (isError ? ' error' : '');
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 2500);
    }
    
    function generateProductCode() { return 'VIO' + Math.random().toString(36).substring(2, 10).toUpperCase(); }
    function formatDate(ts) { if (!ts) return "تاريخ غير معروف"; const d = new Date(ts); return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`; }
    function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    function toggleSection(id) { document.getElementById(id).classList.toggle('open'); }
    
    // Cloudinary Upload
    async function compressImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxSize = 1200;
                    if (width > height && width > maxSize) { height = (height * maxSize) / width; width = maxSize; }
                    else if (height > maxSize) { width = (width * maxSize) / height; height = maxSize; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.6);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }
    
    async function uploadImageToCloudinary(file) {
        const compressed = await compressImage(file);
        const formData = new FormData();
        formData.append('file', compressed);
        formData.append('upload_preset', UPLOAD_PRESET);
        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Upload failed');
            const data = await response.json();
            return data.secure_url;
        } catch (err) {
            const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`);
            const response = await fetch(proxyUrl, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Proxy upload failed');
            const data = await response.json();
            return data.secure_url;
        }
    }
    
    // Save All Data to Firebase
    async function saveAll(keepSectionId = null) {
        try {
            if (currentUserRole === 'super') {
                const adsObj = {};
                ads.forEach(a => { adsObj[a.id] = { image: a.image, text: a.text, active: a.active }; });
                await db.ref('ads').set(adsObj);
            }
            const catsObj = {};
            categories.forEach(c => { 
                catsObj[c.id] = { 
                    name: c.name, 
                    image: c.image, 
                    active: c.active, 
                    order: (c.order !== undefined ? c.order : 0),
                    subcategories: c.subcategories || {}
                }; 
            });
            await db.ref('categories').set(catsObj);
            
            const prodsObj = {};
            products.forEach(p => { 
                prodsObj[p.id] = { 
                    name: p.name, 
                    price: p.price, 
                    oldprice: p.oldprice || '', 
                    desc: p.desc || '', 
                    image: p.image, 
                    categoryId: p.categoryId,
                    subcategoryId: p.subcategoryId || '',
                    code: p.code || generateProductCode(), 
                    sizes: p.sizes || [], 
                    colors: p.colors || [], 
                    active: p.active, 
                    createdAt: p.createdAt || null 
                }; 
            });
            await db.ref('products').set(prodsObj);
            renderAll();
            if (keepSectionId) document.getElementById(keepSectionId)?.classList.add('open');
        } catch (err) { console.error(err); showToast("حفظ البيانات فشل: "+err.message, true); }
    }
    
    // Render Functions
    function renderAds() {
        const container = document.getElementById('adsList');
        if (!container || currentUserRole !== 'super') return;
        container.innerHTML = ads.map(ad => `
            <div class="category-card">
                <div class="flex-between"><img src="${ad.image}" width="50" style="border-radius:12px;"><span class="badge ${ad.active?'badge-active':'badge-inactive'}">${ad.active?'نشط':'مخفي'}</span></div>
                <p class="mt-2">${ad.text||''}</p>
                <div class="flex-start mt-2"><button class="btn btn-primary btn-sm" onclick="toggleAd('${ad.id}')"><i class="fas fa-eye${ad.active?'-slash':''}"></i> ${ad.active?'إخفاء':'إظهار'}</button><button class="btn btn-danger btn-sm" onclick="deleteAd('${ad.id}')"><i class="fas fa-trash"></i> حذف</button><button class="btn btn-secondary btn-sm" onclick="showEditAd('${ad.id}')"><i class="fas fa-edit"></i> تعديل</button></div>
                <div id="editAd_${ad.id}" style="display:none; margin-top:12px; background:#fff0f5; padding:12px; border-radius:18px;"><div class="file-upload-btn" onclick="document.getElementById('editAdFile_${ad.id}').click()"><i class="fas fa-cloud-upload-alt"></i> تغيير الصورة</div><input type="file" id="editAdFile_${ad.id}" style="display:none"><input type="text" id="editAdTxt_${ad.id}" value="${ad.text||''}" class="mt-2"><div class="flex-start mt-2"><button class="btn btn-primary btn-sm" onclick="updateAdImage('${ad.id}')">حفظ الصورة</button><button class="btn btn-primary btn-sm" onclick="updateAdText('${ad.id}')">حفظ النص</button></div></div>
            </div>
        `).join('');
        ads.forEach(ad => { const fi = document.getElementById(`editAdFile_${ad.id}`); if(fi) fi.onchange = (e) => { tempEditAdFile = e.target.files[0]; showToast("تم اختيار صورة جديدة"); }; });
    }
    
    // عرض الأقسام والفئات والمنتجات
    function renderCategories() {
        const container = document.getElementById('categoriesList');
        if (!container) return;
        categories.sort((a,b) => (a.order || 0) - (b.order || 0));
        
        container.innerHTML = categories.map(cat => `
            <div class="category-card">
                <div class="category-header">
                    <div class="flex-start">
                        <img src="${cat.image}" width="45" height="45" style="border-radius:12px; object-fit:cover;">
                        <h3 style="color:#e91e63;">📁 ${escapeHtml(cat.name)}</h3>
                        <span class="badge ${cat.active?'badge-active':'badge-inactive'}">${cat.active?'نشط':'مخفي'}</span>
                    </div>
                    <div class="flex-start">
                        <button class="btn btn-secondary btn-sm" onclick="openEditCatForm('${cat.id}')"><i class="fas fa-edit"></i> تعديل القسم</button>
                        <button class="btn btn-primary btn-sm" onclick="toggleCategory('${cat.id}')"><i class="fas fa-eye${cat.active?'-slash':''}"></i> ${cat.active?'إخفاء':'إظهار'}</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteCategory('${cat.id}')"><i class="fas fa-trash"></i> حذف القسم</button>
                    </div>
                </div>
                
                <!-- نموذج تعديل القسم -->
                <div id="editCatForm_${cat.id}" style="display:none; margin-top:12px; background:#fff0f5; padding:12px; border-radius:18px;">
                    <input type="text" id="editCatName_${cat.id}" value="${cat.name}" placeholder="اسم القسم">
                    <div class="file-upload-btn mt-2" onclick="document.getElementById('editCatFile_${cat.id}').click()"><i class="fas fa-cloud-upload-alt"></i> تغيير صورة القسم</div>
                    <input type="file" id="editCatFile_${cat.id}" style="display:none">
                    <div class="form-group mt-2"><label>رقم الترتيب</label><input type="number" id="editCatOrder_${cat.id}" value="${(cat.order !== undefined ? cat.order + 1 : 1)}" min="1" max="${categories.length}"></div>
                    <div class="flex-start mt-2"><button class="btn btn-primary btn-sm" onclick="updateCategory('${cat.id}')">حفظ</button><button class="btn btn-secondary btn-sm" onclick="closeEditCatForm('${cat.id}')">إلغاء</button></div>
                </div>
                
                <!-- إضافة فئة فرعية جديدة -->
                <div class="form-group mt-2" style="background:#fff5f8; padding:0.8rem; border-radius:16px;">
                    <h4><i class="fas fa-plus-circle"></i> إضافة فئة فرعية جديدة في ${escapeHtml(cat.name)}</h4>
                    <div class="flex-start"><input type="text" id="newSubcatName_${cat.id}" placeholder="اسم الفئة الفرعية" style="width:200px;"><div class="file-upload-btn" onclick="document.getElementById('newSubcatFile_${cat.id}').click()"><i class="fas fa-cloud-upload-alt"></i> صورة</div><input type="file" id="newSubcatFile_${cat.id}" style="display:none"><button class="btn btn-primary btn-sm" onclick="addSubcategory('${cat.id}')"><i class="fas fa-plus"></i> إضافة</button></div>
                    <div id="newSubcatFileName_${cat.id}" style="font-size:0.7rem;">📷 لم يتم اختيار صورة</div>
                </div>
                
                <!-- عرض الفئات الفرعية -->
                <div class="subcategories-container">
                    ${renderSubcategories(cat)}
                </div>
            </div>
        `).join('');
        
        // إعداد الأحداث لرفع الصور
        categories.forEach(cat => {
            const subcatFile = document.getElementById(`newSubcatFile_${cat.id}`);
            if(subcatFile) subcatFile.onchange = (e) => {
                if(e.target.files[0]) {
                    if(!window.tempSubcatFiles) window.tempSubcatFiles = {};
                    window.tempSubcatFiles[cat.id] = e.target.files[0];
                    document.getElementById(`newSubcatFileName_${cat.id}`).innerHTML = `✅ ${e.target.files[0].name}`;
                }
            };
            const editFile = document.getElementById(`editCatFile_${cat.id}`);
            if(editFile) editFile.onchange = (e) => { tempEditCatFile = e.target.files[0]; showToast("تم اختيار صورة جديدة للقسم"); };
        });
    }
    
    function renderSubcategories(cat) {
        const subcats = cat.subcategories || {};
        return Object.keys(subcats).map(subId => {
            const sub = subcats[subId];
            return `
                <div class="subcategory-card">
                    <div class="subcategory-header">
                        <div class="flex-start">
                            ${sub.image ? `<img src="${sub.image}" width="30" height="30" style="border-radius:8px; object-fit:cover;">` : `<div class="subcat-icon"><i class="fas fa-folder"></i></div>`}
                            <strong>📂 ${escapeHtml(sub.name)}</strong>
                            <span class="badge ${sub.active !== false ? 'badge-active' : 'badge-inactive'}">${sub.active !== false ? 'نشط' : 'مخفي'}</span>
                        </div>
                        <div class="flex-start">
                            <button class="btn btn-secondary btn-sm" onclick="openEditSubcatForm('${cat.id}','${subId}')"><i class="fas fa-edit"></i> تعديل</button>
                            <button class="btn btn-primary btn-sm" onclick="toggleSubcategory('${cat.id}','${subId}')"><i class="fas fa-eye${sub.active === false ? '-slash' : ''}"></i> ${sub.active !== false ? 'إخفاء' : 'إظهار'}</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteSubcategory('${cat.id}','${subId}')"><i class="fas fa-trash"></i> حذف</button>
                        </div>
                    </div>
                    
                    <!-- نموذج تعديل الفئة الفرعية -->
                    <div id="editSubcatForm_${cat.id}_${subId}" style="display:none; margin-top:12px; background:white; padding:12px; border-radius:18px;">

    // Load Data
    async function loadData() {
        try {
            const [adsSnap, catSnap, prodSnap] = await Promise.all([db.ref('ads').once('value'), db.ref('categories').once('value'), db.ref('products').once('value')]);
            ads = adsSnap.val() ? Object.keys(adsSnap.val()).map(k=>({id:k, ...adsSnap.val()[k]})) : [];
            categories = catSnap.val() ? Object.keys(catSnap.val()).map(k=>({id:k, ...catSnap.val()[k]})) : [];
            products = prodSnap.val() ? Object.keys(prodSnap.val()).map(k=>({id:k, ...prodSnap.val()[k]})) : [];
            categories.forEach((c, idx) => { if (c.order === undefined) c.order = idx; if (!c.subcategories) c.subcategories = {}; });
            categories.sort((a,b) => (a.order || 0) - (b.order || 0));
            renderAll();
            document.getElementById('searchAllProducts')?.addEventListener('input', (e) => { lastSearchText = e.target.value; renderFilteredProducts(); });
        } catch(err) { console.error(err); showToast("خطأ في تحميل البيانات", true); }
    }
    
    function renderFilteredProducts() {
        const container = document.getElementById('productsList');
        const statsSpan = document.getElementById('productsStats');
        const catsMap = Object.fromEntries(categories.map(c=>[c.id,c.name]));
        let filtered = products;
        if(lastSearchText && lastSearchText.trim()){ const lower = lastSearchText.toLowerCase(); filtered = products.filter(p=>p.name.toLowerCase().includes(lower) || (p.code && p.code.toLowerCase().includes(lower))); }
        statsSpan.innerHTML = `📦 إجمالي المنتجات: ${filtered.length}`;
        if(filtered.length===0){ container.innerHTML='<div class="category-card" style="text-align:center;">لا توجد منتجات</div>'; return; }
        container.innerHTML = filtered.map(p=>`<div class="category-card"><div class="flex-between"><div class="flex-start"><img src="${p.image}" width="40" style="border-radius:8px;"><strong>${escapeHtml(p.name)}</strong> - ${p.price}$</div><span class="badge ${p.active?'badge-active':'badge-inactive'}">${p.active?'نشط':'مخفي'}</span></div><div class="flex-start mt-1" style="font-size:0.75rem;"><span class="badge" style="background:#e91e63; color:white;">🔑 ${p.code || 'بدون رمز'}</span><span>القسم: ${catsMap[p.categoryId]||'غير محدد'}</span></div><div class="product-date" style="font-size:0.7rem; color:#b08a9e;"><i class="far fa-clock"></i> ${formatDate(p.createdAt)}</div><div class="flex-start mt-2"><button class="btn btn-secondary btn-sm" onclick="editGlobalProduct('${p.id}')">تعديل</button><button class="btn btn-primary btn-sm" onclick="toggleProduct('${p.id}')"><i class="fas fa-eye${p.active?'-slash':''}"></i> ${p.active?'إخفاء':'إظهار'}</button><button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">حذف</button></div><div id="globalEdit_${p.id}" style="display:none; margin-top:12px; background:#fff0f5; padding:12px; border-radius:18px;"><div class="file-upload-btn" onclick="document.getElementById('globalImg_${p.id}').click()"><i class="fas fa-cloud-upload-alt"></i> تغيير الصورة</div><input type="file" id="globalImg_${p.id}" style="display:none"><input type="text" id="gName_${p.id}" value="${p.name}" class="mt-2"><input type="text" id="gPrice_${p.id}" value="${p.price}" class="mt-2"><input type="text" id="gOld_${p.id}" value="${p.oldprice||''}" class="mt-2"><textarea id="gDesc_${p.id}" rows="2" class="mt-2">${p.desc||''}</textarea><input type="text" id="gCode_${p.id}" value="${p.code||''}" placeholder="رمز المنتج" class="mt-2"><div class="flex-start mt-2"><button class="btn btn-primary btn-sm" onclick="updateGlobalProductImage('${p.id}')">حفظ الصورة</button><button class="btn btn-primary btn-sm" onclick="updateGlobalProductData('${p.id}')">حفظ البيانات</button></div></div></div>`).join('');
        products.forEach(p=>{ const fi=document.getElementById(`globalImg_${p.id}`); if(fi) fi.onchange=(e)=>{ tempEditProductFile[p.id]=e.target.files[0]; showToast("تم اختيار صورة جديدة"); }; });
    }
    
    window.editGlobalProduct = (id) => { document.getElementById(`globalEdit_${id}`).style.display = 'block'; };
    window.updateGlobalProductImage = async (id) => { if(!tempEditProductFile[id]) return showToast("اختر صورة",true); const url=await uploadImageToCloudinary(tempEditProductFile[id]); const prod=products.find(p=>p.id===id); prod.image=url; await saveAll('allProductsContent'); delete tempEditProductFile[id]; showToast("تم تحديث الصورة"); };
    window.updateGlobalProductData = async (id) => { const prod=products.find(p=>p.id===id); prod.name=document.getElementById(`gName_${id}`).value; prod.price=document.getElementById(`gPrice_${id}`).value; prod.oldprice=document.getElementById(`gOld_${id}`).value; prod.desc=document.getElementById(`gDesc_${id}`).value; let nc=document.getElementById(`gCode_${id}`).value.trim(); if(nc) prod.code=nc; await saveAll('allProductsContent'); document.getElementById(`globalEdit_${id}`).style.display='none'; showToast("تم تعديل المنتج"); };
    
    function renderAll() { if (currentUserRole === 'super') renderAds(); renderCategories(); renderFilteredProducts(); }
    
    // Auth
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        try {
            const roleSnap = await db.ref(`admins/${user.uid}/role`).once('value');
            const role = roleSnap.val();
            if (role === 'super') { currentUserRole = 'super'; const adsSection = document.getElementById('adsSection'); if (adsSection) adsSection.style.display = 'block'; }
            else { currentUserRole = 'admin'; const adsSection = document.getElementById('adsSection'); if (adsSection) adsSection.style.display = 'none'; }
            await loadData();
        } catch (err) { currentUserRole = 'admin'; const adsSection = document.getElementById('adsSection'); if (adsSection) adsSection.style.display = 'none'; await loadData(); }
    });
    document.getElementById('logoutBtn').onclick = () => auth.signOut().then(() => window.location.href = 'login.html');
    
    document.getElementById('addCategoryBtn').onclick = async () => {
        const name = document.getElementById('newCatName').value.trim();
        const fileInput = document.getElementById('newCatImageFile');
        if(!name) return showToast("اسم القسم مطلوب", true);
        if(!fileInput.files.length) return showToast("صورة القسم مطلوبة", true);
        let orderRaw = document.getElementById('newCatOrder').value;
        let order = parseInt(orderRaw, 10);
        if (isNaN(order)) order = categories.length + 1;
        try {
            const url = await uploadImageToCloudinary(fileInput.files[0]);
            const newId = Date.now().toString();
            categories.push({ id: newId, name, image: url, active: true, order: order - 1, subcategories: {} });
            categories.sort((a,b) => (a.order || 0) - (b.order || 0));
            await saveAll('categoriesContent');
            document.getElementById('newCatName').value = '';
            fileInput.value = '';
            document.getElementById('newCatFileName').innerHTML = '📁 لم يتم اختيار ملف';
            showToast("تمت إضافة القسم");
        } catch(err) { showToast(err.message, true); }
    };
    document.getElementById('newCatImageFile').onchange = (e) => { document.getElementById('newCatFileName').innerHTML = `📁 ${e.target.files[0]?.name || ''}`; };
    
    document.getElementById('addAdBtn').onclick = async () => {
        if (currentUserRole !== 'super') return showToast("غير مصرح لك", true);
        const fileInput = document.getElementById('newAdImageFile');
        if(!fileInput.files.length) return showToast("اختر صورة للإعلان", true);
        const text = document.getElementById('newAdText').value;
        try {
            const url = await uploadImageToCloudinary(fileInput.files[0]);
            ads.push({ id: Date.now().toString(), image: url, text: text || '', active: true });
            await saveAll('adsContent');
            fileInput.value = '';
            document.getElementById('newAdFileName').innerHTML = '📁 لم يتم اختيار ملف';
            document.getElementById('newAdText').value = '';
            showToast("تمت إضافة الإعلان");
        } catch(err) { showToast(err.message, true); }
    };
    document.getElementById('newAdImageFile').onchange = (e) => { document.getElementById('newAdFileName').innerHTML = `📁 ${e.target.files[0]?.name || ''}`; };
    
    window.tempSizes = {};
    window.tempColors = {};
    window.tempSubcatFiles = {};
</script>
</body>
</html>
